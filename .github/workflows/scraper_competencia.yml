name: Scraper Competencia (2x día)

on:
  schedule:
    - cron: "0 17 * * *"   # 12:00 PM Ciudad de México (UTC-5)
    - cron: "0 22 * * *"   # 17:00 PM Ciudad de México (UTC-5)
  workflow_dispatch:        # también puedes correrlo manualmente desde GitHub

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar el scraper
        run: python scraper_competencia.py

      - name: Guardar DB en el repo
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add inventario_competencia.db
          git commit -m "Update DB competencia [$(date -u +%Y-%m-%dT%H:%M)]" || echo "Sin cambios"
          git push
